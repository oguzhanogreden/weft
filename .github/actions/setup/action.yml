name: Setup
description: Setup pnpm, Node.js, and install dependencies

runs:
  using: composite
  steps:
    - name: VP Setup
      uses: voidzero-dev/setup-vp@v1
      with:
        node-version: 26
        cache: true

    - name: Restore Vite+ task cache
      uses: actions/cache@v5
      with:
        path: node_modules/.vite/task-cache
        key: vp-task-cache-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          vp-task-cache-${{ runner.os }}-${{ github.job }}-
          vp-task-cache-${{ runner.os }}-
