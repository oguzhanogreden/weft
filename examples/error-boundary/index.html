<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error Boundaries - Effect UI</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        background: #fff;
        min-height: 100vh;
        color: #000;
        padding: 2rem;
      }

      #root {
        max-width: 860px;
        margin: 0 auto;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.25rem;
      }

      h2 {
        font-size: 1rem;
        margin-bottom: 0.5rem;
      }

      .subtitle {
        color: #666;
        margin-bottom: 2rem;
        font-size: 0.875rem;
      }

      .section {
        margin: 1.5rem 0;
        padding: 1rem;
        border: 1px solid #000;
      }

      p {
        color: #444;
        font-size: 0.8rem;
        margin-bottom: 0.75rem;
      }

      .demo {
        padding: 0.75rem;
        background: #f8f8f8;
        border: 1px solid #ddd;
        min-height: 2.5rem;
      }

      .demo-row {
        display: flex;
        gap: 1rem;
      }

      .demo-row > * {
        flex: 1;
      }

      .error-box {
        display: inline-block;
        padding: 0.4rem 0.75rem;
        background: #fff0f0;
        border: 1px solid #faa;
        color: #c00;
        font-size: 0.875rem;
      }

      .error-box--auth {
        background: #fff8e6;
        border-color: #f5c26b;
        color: #7a4f00;
      }

      .error-box--outer {
        background: #f0f0ff;
        border-color: #aaf;
        color: #00c;
      }

      .live {
        color: #080;
      }

      .muted {
        color: #999;
      }

      .inner-region {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .btn {
        padding: 0.3rem 0.75rem;
        background: #000;
        color: #fff;
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.8rem;
      }

      .btn:hover {
        background: #333;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
