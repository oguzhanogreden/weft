<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>effect-ui - SSR + Hydration</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        background: #fff;
        min-height: 100vh;
        color: #000;
        padding: 2rem;
      }

      #root {
        max-width: 640px;
        margin: 0 auto;
      }

      h1 {
        margin-bottom: 1rem;
      }

      p {

        line-height: 1.5;
      }

      .count {
        font-size: 2.5rem;
        font-weight: bold;
        margin: 1rem 0;
      }

      button {
        background: #000;

        border: none;
        padding: 0.5rem 1rem;
        cursor: pointer;
        font-family: inherit;
        font-size: 1rem;
        margin-right: 0.5rem;
      }

      button:hover {
        background: #333;
      }

      .status {
        display: inline-block;
        padding: 0.25rem 0.5rem;

        border: 1px solid #000;
      }

    <div id="root"><!--ssr-outlet--></div>
