<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyed List (List.each) - Weft</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        background: #fff;
        min-height: 100vh;
        color: #000;
        padding: 2rem;
      }

      #root {
        max-width: 720px;
        margin: 0 auto;
      }

      h1 {
        margin-bottom: 0.5rem;
      }

      p.hint {
        margin-bottom: 1rem;
        color: #555;
      }

      .controls {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }

      button {
        font: inherit;
        padding: 0.4rem 0.8rem;
        border: 1px solid #000;
        background: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #eee;
      }

      ul {
        list-style: none;
        padding: 0;
      }

      li {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.6rem;
        margin: 0.35rem 0;
        border: 1px solid #000;
      }

      li .key {
        font-weight: bold;
        width: 2.5rem;
      }

      li .count {
        margin-left: auto;
        padding: 0.2rem 0.5rem;
        border: 1px solid #999;
        background: #f5f5f5;
      }

      li input {
        font: inherit;
        padding: 0.3rem;
        border: 1px solid #999;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
