<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Type Augmentation (custom elements on h) - Weft</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        background: #fff;
        min-height: 100vh;
        color: #000;
        padding: 2rem;
      }

      #root {
        max-width: 480px;
        margin: 0 auto;
      }

      section {
        border: 1px solid #000;
        padding: 1rem;
        margin-bottom: 1rem;
      }

      greeting-badge {
        display: inline-block;
        padding: 0.3rem 0.6rem;
        border: 1px solid #999;
        background: #f5f5f5;
      }

      input {
        font: inherit;
        margin-top: 0.6rem;
        display: block;
        padding: 0.3rem;
        border: 1px solid #999;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
