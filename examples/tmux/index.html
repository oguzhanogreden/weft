<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tmux in the browser - Weft</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        background: #0b0e14;
        min-height: 100vh;
        color: #b3b1ad;
        padding: 1.5rem;
      }

      #root {
        max-width: 960px;
        margin: 0 auto;
      }

      .term {
        background: #0d1017;
        border: 1px solid #1c2230;
        border-radius: 4px;
        padding: 0.5rem 0.75rem;
        font-size: 13px;
        line-height: 1.25;
        white-space: pre;
        overflow: auto;
        outline: none;
      }

      .term:focus {
        border-color: #39bae6;
      }

      .term-row {
        white-space: pre;
        min-height: 1.25em;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
