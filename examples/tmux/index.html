<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tmux in the browser - Weft</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        background: #0b0e14;
        min-height: 100vh;
        color: #b3b1ad;
        padding: 1.5rem;
      }

      #root {
        max-width: 960px;
        margin: 0 auto;
      }

      .term {
        background: #0d1017;
        border: 1px solid #1c2230;
        border-radius: 4px;
        padding: 0.5rem 0.75rem;
        white-space: pre;
        overflow: auto;
        outline: none;
      }

      .term:focus {
        border-color: #39bae6;
      }

      .term-row {
        white-space: pre;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex-wrap: wrap;
        margin-bottom: 0.75rem;
        font-size: 12px;
      }

      .controls .label {
        color: #6b7280;
        margin-left: 0.5rem;
      }

      .controls .label:first-child {
        margin-left: 0;
      }

      .level {
        background: #0d1017;
        color: #b3b1ad;
        border: 1px solid #1c2230;
        border-radius: 3px;
        padding: 0.15rem 0.5rem;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
      }

      .level:hover {
        border-color: #39bae6;
      }

      .meter {
        margin-left: 0.5rem;
        color: #39bae6;
        font-variant-numeric: tabular-nums;
      }

      .terminal-pane {
        font-size: 13px;
        outline: none;
      }

      /* Hidden probe: measured once on mount to pixel-lock the grid (AC-PIXELGRID). */
      .term-probe {
        position: absolute;
        visibility: hidden;
        pointer-events: none;
        white-space: pre;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
